name: Build and publish third-party binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Verify, build, commit and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: runtime/go.mod
      - name: Verify tests and Go static analysis
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1 -timeout=150s
          go vet ./...
      - name: Build binaries directly from published sources
        shell: bash
        run: |
          set -euo pipefail
          for os in darwin linux; do
            for arch in arm64 amd64; do
              for name in magpie-tui-runtime magpie-tui-mcp-helper; do
                (cd runtime && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "../bin/$name.$os-$arch" "./cmd/$name")
              done
            done
          done
          sha256sum bin/magpie-tui-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish exact binary source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/ SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "Build reproducible v0.1.0 runtime/helper binaries from source"
            git push origin HEAD:main
          fi
      - name: Tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --tags origin refs/tags/v0.1.0 | grep -q .; then
            git tag -a v0.1.0 -m 'Initial independent third-party source+binary release'
            git push origin v0.1.0
          fi
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 bin/magpie-tui-runtime.* bin/magpie-tui-mcp-helper.* SHA256SUMS \
              --title 'v0.1.0 — experimental unofficial Claude TUI provider' \
              --notes-file RELEASE_NOTES.md
          fi
