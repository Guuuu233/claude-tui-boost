name: Build and publish third-party binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semver tag to create (e.g. v0.1.1)'
        required: true
        type: string
        default: v0.2.7

permissions:
  contents: write

jobs:
  publish:
    name: Verify, build, commit and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install tmux for isolated SSH-login tests
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Load verified Magpie host for mandatory compatibility checks
        uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: 95e7c6bcc07629897f6703c31eaef477fcee4a13
          path: .compat-host
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /internal/plugin/host.js
            /LICENSE
      - name: Verify plugin and isolated first-connect tests
        env:
          MAGPIE_TUI_TEST_HOST: ${{ github.workspace }}/.compat-host/internal/plugin/host.js
        run: bun test
      - name: Load unmodified Magpie v0.1.1268 for release compatibility
        uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: 63be47717a9ca91fc89102078a1f1fff3e03e0ce
          path: .compat-host-1268
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /internal/plugin/host.js
            /LICENSE
      - name: Verify plugin against unmodified Magpie v0.1.1268
        env:
          MAGPIE_TUI_TEST_HOST: ${{ github.workspace }}/.compat-host-1268/internal/plugin/host.js
        run: bun test
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: runtime/go.mod
      - name: Provide non-inferencing Claude CLI stub for integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-stub-bin"
          cat > "$RUNNER_TEMP/claude-stub-bin/claude" <<'STUB'
          #!/usr/bin/env sh
          if [ "${1:-}" = "--version" ]; then
            printf '%s\n' '2.1.296 (Claude Code test stub)'
            exit 0
          fi
          echo 'refusing real Claude calls in offline CI' >&2
          exit 93
          STUB
          chmod 700 "$RUNNER_TEMP/claude-stub-bin/claude"
          echo "$RUNNER_TEMP/claude-stub-bin" >> "$GITHUB_PATH"
      - name: Verify tests and Go static analysis
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1 -timeout=150s
          go vet ./...
      - name: Build binaries directly from published sources
        shell: bash
        run: |
          set -euo pipefail
          for os in darwin linux; do
            for arch in arm64 amd64; do
              for name in magpie-tui-runtime magpie-tui-mcp-helper; do
                (cd runtime && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "../bin/$name.$os-$arch" "./cmd/$name")
              done
            done
          done
          sha256sum bin/magpie-tui-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish exact binary source commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/ SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "Build $RELEASE_TAG runtime/helper binaries from source"
            git push origin HEAD:main
          fi
      - name: Tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 2; }
          if ! git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            git tag -a "$RELEASE_TAG" -m "Independent third-party $RELEASE_TAG release"
            git push origin "$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" bin/magpie-tui-runtime.* bin/magpie-tui-mcp-helper.* SHA256SUMS \
              --title "$RELEASE_TAG — experimental unofficial Claude TUI provider" \
              --notes-file RELEASE_NOTES.md
          fi
