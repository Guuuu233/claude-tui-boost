name: Plugin source and distributable package

on:
  push:
    branches: ['fix/**']
  pull_request:
  workflow_dispatch:

# A proposed fix must never install, restart, log in to, or upgrade production.
permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      MAGPIE_TUI_PLUGIN_CONFIG: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: runtime/go.mod
      - name: Install PTY dependency for synthetic session tests
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: 63be47717a9ca91fc89102078a1f1fff3e03e0ce
          path: .compat-host
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /internal/plugin/host.js
            /LICENSE
      - name: Contract tests against unchanged upstream Magpie v0.1.1268
        env:
          MAGPIE_TUI_TEST_HOST: ${{ github.workspace }}/.compat-host/internal/plugin/host.js
        run: bun test
      - name: Provide offline Claude CLI stub for Runtime integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-stub-bin"
          cat > "$RUNNER_TEMP/claude-stub-bin/claude" <<'STUB'
          #!/usr/bin/env sh
          if [ "${1:-}" = "--version" ]; then
            printf '%s\n' '2.1.296 (Claude Code offline test stub)'
            exit 0
          fi
          echo 'Refusing real Claude inference in CI' >&2
          exit 93
          STUB
          chmod 700 "$RUNNER_TEMP/claude-stub-bin/claude"
          echo "$RUNNER_TEMP/claude-stub-bin" >> "$GITHUB_PATH"
      - name: Race tests and static analysis for shipped Go Runtime
        working-directory: runtime
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -p 2 ./... -count=1 -timeout=240s
          go vet -p 2 ./...
      - name: Repeat crash, disconnect and MCP handoff fault injection
        working-directory: runtime
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          set -euo pipefail
          # All cases use synthetic callbacks, isolated PTY state, a fake
          # Claude CLI and disposable tools. No authenticated inference.
          go test -race -p 2 ./internal/bridge \
            -run '^(TestInteractiveFaultInjection|TestInteractiveTransportMCPResultContinuesSamePTYRun|TestInteractiveTransportParallelMCPResultsCanArriveTogether|TestInteractiveAutoRecovery|TestNativeHardKillDetachedTmuxRefusesRecoveryWithoutToolReplay|TestCompaction|TestRestore)' \
            -count=3 -timeout=210s
      - name: Rebuild every distributed executable from plugin source
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          for os in darwin linux; do
            for arch in arm64 amd64; do
              for kind in magpie-tui-runtime magpie-tui-mcp-helper; do
                (cd runtime && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                  go build -trimpath -buildvcs=false -o "$dir/$kind.$os-$arch" "./cmd/$kind")
                cmp "$dir/$kind.$os-$arch" "bin/$kind.$os-$arch"
              done
            done
          done
          node scripts/verify-package-assets.mjs
      - name: Verify actual npm release archive without publishing
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          npm pack --silent --pack-destination "$dir"
          name="$(node -p 'const p=require("./package.json"); `${p.name}-${p.version}.tgz`')"
          tar -xzf "$dir/$name" -C "$dir"
          node "$dir/package/scripts/verify-package-assets.mjs"
          test -f "$dir/package/scripts/magpie-tui-doctor.mjs"
          test -f "$dir/package/RELEASE_NOTES.md"
          test -f "$dir/package/bin/magpie-tui-runtime.linux-amd64"
          test -f "$dir/package/bin/magpie-tui-mcp-helper.darwin-arm64"
